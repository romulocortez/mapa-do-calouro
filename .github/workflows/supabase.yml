# Aplica as migrações do banco (supabase/migrations) no projeto do Supabase, depois de testar as regras de acesso.
# Precisa de: secrets SUPABASE_ACCESS_TOKEN e SUPABASE_DB_PASSWORD; variável SUPABASE_PROJECT_REF (ver docs/SUPABASE.md).
# Sem esses valores, só roda os testes e não toca em nenhum banco.
name: Banco no Supabase
on:
  push:
    branches: [main]
    paths: ["supabase/**", "tests/db/**", ".github/workflows/supabase.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency: { group: supabase-deploy, cancel-in-progress: false }
jobs:
  banco:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Testes das regras de acesso (Postgres local, dados inventados)
        run: npm run test:banco
      - name: Instala a ferramenta do Supabase
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''
        uses: supabase/setup-cli@v1
        with: { version: 2.118.0 }
      - name: Aplica as migrações
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD"
          supabase config push --yes   # login só por código, sem contas anônimas, gancho do e-mail UFPI, modelo do e-mail
