# Aplica as migrações do banco (supabase/migrations) no projeto do Supabase, depois de testar as regras de acesso.
# Precisa de: secrets SUPABASE_DB_URL (conexão "Session pooler", com a senha) e SUPABASE_ACCESS_TOKEN
# (token só com configuração de Auth, Storage, Realtime e Data API); variável SUPABASE_PROJECT_REF (ver docs/SUPABASE.md).
# Sem esses valores, só roda os testes e não toca em nenhum banco.
name: Banco no Supabase
on:
  push:
    branches: [main]
    paths: ["supabase/**", "tests/db/**", ".github/workflows/supabase.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency: { group: supabase-deploy, cancel-in-progress: false }
jobs:
  banco:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Testes das regras de acesso (Postgres local, dados inventados)
        run: npm run test:banco
      - name: Instala a ferramenta do Supabase
        if: env.SUPABASE_DB_URL != ''
        uses: supabase/setup-cli@v1
        with: { version: 2.118.0 }
      - name: Aplica as migrações (conexão direta ao banco; o token não precisa de acesso ao banco)
        if: env.SUPABASE_DB_URL != ''
        run: supabase db push --db-url "$SUPABASE_DB_URL" --yes
      - name: Aplica a configuração do login, Storage e Realtime
        if: env.SUPABASE_DB_URL != '' && env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''
        run: supabase config push --project-ref "$SUPABASE_PROJECT_REF" --yes   # só código por e-mail, sem contas anônimas, gancho do e-mail UFPI
