# Roda todos os testes a cada envio para o GitHub. Se algo quebrar, aparece um X vermelho no commit.
name: Testes do Mapa do Calouro
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Testes na versão beta (/beta/)
        if: hashFiles('beta/index.html') != ''
        run: npm test
        env:
          PAGINA: /beta/
      - name: Relatório dos testes de navegador (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-playwright
          path: playwright-report/
          retention-days: 7
